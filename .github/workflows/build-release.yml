name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/ringr-release.jks

      - name: Compute version vars
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version_name=${TAG}" >> $GITHUB_OUTPUT
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version_code=${COMMIT_COUNT}" >> $GITHUB_OUTPUT

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG_VERSION: ${{ steps.version.outputs.version_name }}
          TAG_VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ringr-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk Ringr-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RingR v${{ steps.version.outputs.version_name }}
          files: |
            Ringr-release.apk
            Ringr-debug.apk
          generate_release_notes: true
